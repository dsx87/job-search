name: Daily Job Search

on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC = 14:00 Israel (summer); staggered ~4h after the Pi's 10:00 local run
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  search:
    # Scheduled runs are inert until the repository owner explicitly enables
    # the personal deployment. A manually requested run reaches the setup guard
    # below and reports incomplete configuration rather than silently skipping.
    if: github.event_name != 'schedule' || vars.PERSONAL_RUNS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # ubuntu-latest has no 15-min execution cap (unlike the ubuntu-slim runner);
    # this generous timeout just guards against a hung run burning Actions minutes.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate private configuration request
        env:
          PERSONAL_RUNS_ENABLED: ${{ vars.PERSONAL_RUNS_ENABLED }}
          CONFIG_REPOSITORY: ${{ vars.CONFIG_REPOSITORY }}
          CONFIG_REF: ${{ vars.CONFIG_REF }}
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_DEPLOY_KEY }}
        run: |
          failed=0
          [ "$PERSONAL_RUNS_ENABLED" = "true" ] || { echo "::error::Set PERSONAL_RUNS_ENABLED=true before requesting a personal run."; failed=1; }
          [[ "$CONFIG_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::CONFIG_REPOSITORY must be owner/repository."; failed=1; }
          [[ "$CONFIG_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::CONFIG_REF must be a lowercase full 40-character commit SHA."; failed=1; }
          [ -n "$CONFIG_DEPLOY_KEY" ] || { echo "::error::CONFIG_DEPLOY_KEY is required."; failed=1; }
          exit "$failed"

      - name: Checkout pinned private configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONFIG_REPOSITORY }}
          ref: ${{ vars.CONFIG_REF }}
          ssh-key: ${{ secrets.CONFIG_DEPLOY_KEY }}
          persist-credentials: false
          path: .private-config/job-search-config

      - name: Verify private configuration revision
        env:
          CONFIG_REF: ${{ vars.CONFIG_REF }}
        run: |
          actual="$(git -C .private-config/job-search-config rev-parse HEAD)"
          [ "$actual" = "$CONFIG_REF" ] || { echo "::error::Private configuration checkout does not match CONFIG_REF."; exit 1; }

      # Dedup state lives on its own orphan branch so it never clutters main.
      - name: Checkout dedup state branch
        id: state_checkout
        uses: actions/checkout@v4
        with:
          ref: state
          path: .state

      # Tolerate a state branch that doesn't carry the file yet (a fresh branch,
      # or one whose first push never landed): the pipeline treats a missing
      # seen_jobs.json as its documented first-run sentinel, which is a far
      # better outcome than failing the whole run on a `cp`.
      - name: Load seen_jobs.json from state branch
        run: |
          if [ -f .state/seen_jobs.json ]; then
            cp .state/seen_jobs.json seen_jobs.json
          else
            echo "No seen_jobs.json on the state branch yet — starting from empty state."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate pinned private configuration
        env:
          JOB_SEARCH_SETTINGS_FILE: ${{ github.workspace }}/.private-config/job-search-config/job_search.toml
        run: |
          python3 -m job_search.pipeline --validate-config "$JOB_SEARCH_SETTINGS_FILE"

      - name: Install Chromium for Playwright (secrettelaviv source)
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
          # Generic scheme-based LLM providers. Primary key reuses the existing
          # GEMINI_API_KEY secret; the optional fallback uses OPENAI_API_KEY.
          LLM_PRIMARY_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional provider overrides (defaults live in code — leave the repo
          # variables unset to use them).
          LLM_PRIMARY_SCHEME: ${{ vars.LLM_PRIMARY_SCHEME }}
          LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
          LLM_PRIMARY_API_BASE: ${{ vars.LLM_PRIMARY_API_BASE }}
          LLM_PRIMARY_AUTH_MODE: ${{ vars.LLM_PRIMARY_AUTH_MODE }}
          LLM_FALLBACK_SCHEME: ${{ vars.LLM_FALLBACK_SCHEME }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_API_BASE: ${{ vars.LLM_FALLBACK_API_BASE }}
          LLM_FALLBACK_AUTH_MODE: ${{ vars.LLM_FALLBACK_AUTH_MODE }}
          JOB_SEARCH_SETTINGS_FILE: ${{ github.workspace }}/.private-config/job-search-config/job_search.toml
          CV_PHONE: ${{ secrets.CV_PHONE }}
          # Publish the digest as a telegra.ph page instead of a ZIP. Unset
          # (the default) is a no-op -- see README's Actions-secrets table.
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
        run: python3 -u -m job_search.pipeline

      # `if: always()` mirrors the Pi's `push_state()` in a `finally` block
      # ("push even on error"). run_daily re-raises on a fatal error precisely
      # when it has ALREADY marked non-fits seen, written deferral markers, and
      # incremented retry counters — skipping the push there throws all of that
      # away and re-pays the LLM cost next run. Every key is set-union-safe, so
      # sharing partial-run state is sound. Without this the two runners
      # disagreed, and CI was the one contradicting the documented intent.
      - name: Persist seen_jobs.json to state branch
        if: ${{ always() && steps.state_checkout.outcome == 'success' }}
        working-directory: .state
        run: |
          if [ ! -f ../seen_jobs.json ]; then
            echo "No seen_jobs.json produced (the run failed before writing state)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ../seen_jobs.json seen_jobs.json
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "No seen_jobs.json changes to commit."
            exit 0
          fi
          git commit -m "chore: update seen jobs state [skip ci]"

          # Push with retry: if another run pushed to state meanwhile, the push
          # is rejected. Rather than a textual rebase (which can corrupt the JSON
          # array), rebuild seen_jobs.json as the set-union of our keys and the
          # remote's, recommit on top of the remote tip, and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:state; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); merging remote state and retrying..."
            git fetch origin state
            # Set-union merge lives in the package (job_search.state.seen_merge), not
            # inline here. cwd is .state (so the refs resolve there); PYTHONPATH points
            # at the main checkout, which is where the job_search package lives.
            PYTHONPATH="$GITHUB_WORKSPACE" python3 -m job_search.state.seen_merge \
              /tmp/seen_union.json HEAD origin/state
            git reset --hard origin/state
            cp /tmp/seen_union.json seen_jobs.json
            git add seen_jobs.json
            if git diff --cached --quiet; then
              echo "Remote already has all our keys; nothing to push."
              exit 0
            fi
            git commit -m "chore: update seen jobs state [skip ci]"
          done
          echo "Failed to push seen_jobs.json after retries." >&2
          exit 1
