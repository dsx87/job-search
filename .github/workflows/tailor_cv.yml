name: Tailor CV

# Manually tailor a CV for ONE specific job posting and deliver it to Telegram.
# Reuses the same generic scheme-based LLM providers + pdflatex compile path as
# the daily pipeline. The phone number is injected at compile time from the
# CV_PHONE secret and never enters the repo.
#
# Provide a URL (the action tries to fetch it) and/or paste the job text. If the
# URL is blocked or needs JavaScript, the fetch yields too little text and the
# run fails with a clear message — re-run with the job text pasted instead.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Job posting URL (auto-fetched; leave blank if pasting text)"
        required: false
        default: ""
      job_text:
        description: "Job description text (paste fallback when the URL can't be fetched)"
        required: false
        default: ""
      title:
        description: "Job title (optional)"
        required: false
        default: ""
      company:
        description: "Company name (optional)"
        required: false
        default: ""
      location:
        description: "Job location (optional)"
        required: false
        default: ""

jobs:
  tailor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Materialize optional composition config
        env:
          JOB_SEARCH_CONFIG_PY: ${{ secrets.JOB_SEARCH_CONFIG_PY }}
        run: |
          if [ -n "$JOB_SEARCH_CONFIG_PY" ]; then
            printf '%s' "$JOB_SEARCH_CONFIG_PY" > job_search_config.py
            echo "Wrote job_search_config.py from the Actions secret."
          else
            echo "Using a tracked job_search_config.py when present; otherwise built-in defaults."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Tailor CV and send to Telegram
        env:
          PYTHONUNBUFFERED: "1"
          # Generic scheme-based LLM providers (see the daily workflow).
          LLM_PRIMARY_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PRIMARY_SCHEME: ${{ vars.LLM_PRIMARY_SCHEME }}
          LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
          LLM_PRIMARY_API_BASE: ${{ vars.LLM_PRIMARY_API_BASE }}
          LLM_PRIMARY_AUTH_MODE: ${{ vars.LLM_PRIMARY_AUTH_MODE }}
          LLM_FALLBACK_SCHEME: ${{ vars.LLM_FALLBACK_SCHEME }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_API_BASE: ${{ vars.LLM_FALLBACK_API_BASE }}
          LLM_FALLBACK_AUTH_MODE: ${{ vars.LLM_FALLBACK_AUTH_MODE }}
          CV_PHONE: ${{ secrets.CV_PHONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pass dispatch inputs through the environment (data, not shell) so a
          # crafted value cannot inject commands into the run: block below.
          IN_URL: ${{ inputs.url }}
          IN_JOB_TEXT: ${{ inputs.job_text }}
          IN_TITLE: ${{ inputs.title }}
          IN_COMPANY: ${{ inputs.company }}
          IN_LOCATION: ${{ inputs.location }}
        run: |
          python3 -u -m job_search.pipeline --tailor \
            --url "$IN_URL" \
            --job-text "$IN_JOB_TEXT" \
            --title "$IN_TITLE" \
            --company "$IN_COMPANY" \
            --location "$IN_LOCATION"
