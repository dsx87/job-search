name: Tests

# Runs the offline characterization suite — the safety net that proves the
# job_search package's behavior is unchanged. Fast, deterministic, and needs no
# secrets, network, or LaTeX. The small AES archive dependency is installed;
# source-only deps (jobspy/playwright) intentionally are not, proving the source
# registry still builds without them.
on:
  push:
    paths:
      - job_search/**
      - tests/**
      - job_search_config.py
      - job_search_config.example.py
      # scripts/ is part of the shipped runtime (run_pipeline.sh, the Pi setup
      # scripts) and was missing from this filter, so changes there ran no tests.
      - scripts/**
      - pyproject.toml
      - requirements.txt
      - .github/workflows/tests.yml
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # The stated floor is 3.9 (Raspberry Pi OS Bullseye) and the README bans
    # 3.10+ syntax — a rule only the Pi could catch until this leg existed.
    # 3.12 is what the daily workflow actually runs on.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest 'pyzipper~=0.4.0'

      - name: Run offline characterization suite
        run: pytest
