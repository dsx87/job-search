name: Render fictional base CV

# Render the public fictional fixture as an artifact. Personal CVs live only
# in the separately pinned private configuration repository.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Render fictional base CV PDF
        env:
          JOB_SEARCH_RENDER_BASE_MANIFEST: ${{ runner.temp }}/rendered-base-path
        run: |
          mkdir -p build
          JOB_SEARCH_SETTINGS_FILE=job_search.example.toml \
            BASE_TEX_FILE=avery_example_base.tex \
            OUT_PDF_FILE=build/avery_example_base.pdf \
            python3 -m job_search.latex.render_base

      - name: Upload fictional PDF
        uses: actions/upload-artifact@v4
        with:
          name: avery-example-base-cv
          path: build/avery_example_base.pdf
          if-no-files-found: error
