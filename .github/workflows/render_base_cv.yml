name: Render base CV

# Manually regenerate the committed sample PDF from the .tex source.
# CV_PHONE is intentionally left unset here, so the public sample shows no
# phone number. The daily pipeline injects the real number from the secret.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Materialize optional composition config
        env:
          JOB_SEARCH_CONFIG_PY: ${{ secrets.JOB_SEARCH_CONFIG_PY }}
        run: |
          if [ -n "$JOB_SEARCH_CONFIG_PY" ]; then
            printf '%s' "$JOB_SEARCH_CONFIG_PY" > job_search_config.py
            echo "Wrote job_search_config.py from the Actions secret."
          else
            echo "Using a tracked job_search_config.py when present; otherwise built-in defaults."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Render masked base CV PDF
        env:
          JOB_SEARCH_RENDER_BASE_MANIFEST: ${{ runner.temp }}/rendered-base-path
        run: python3 -m job_search.latex.render_base

      - name: Commit regenerated PDF
        env:
          RENDERED_BASE_MANIFEST: ${{ runner.temp }}/rendered-base-path
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          IFS= read -r rendered_path < "$RENDERED_BASE_MANIFEST"
          case "$rendered_path" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "Rendered artifact is outside the checkout: $rendered_path"; exit 1 ;;
          esac
          git add -f -- "$rendered_path"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate masked base CV PDF [skip ci]"
          git push
