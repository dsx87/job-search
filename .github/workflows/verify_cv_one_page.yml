name: Verify CV one-page guard

# Proves page-limit enforcement using synthetic documents and a fictional
# candidate fixture. It never loads private deployment configuration.
on:
  workflow_dispatch:
  push:
    paths:
      - job_search/latex/**
      - job_search/llm/tailor.py
      - avery_example_base.tex
      - tests/fixtures/fictional_candidate.tex
      - job_search/tests/one_page_guard.py
      - job_search/tests/page_limit_guard.py
      - .github/workflows/verify_cv_one_page.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest 'pyzipper~=0.4.0'

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Run synthetic page-limit guard
        run: python3 -m job_search.tests.page_limit_guard

      - name: Run root fictional one-page shrink guard
        run: python3 -m job_search.tests.one_page_guard --fixture avery_example_base.tex

      - name: Run fictional candidate PDF flow
        run: pytest tests/test_fictional_candidate_flow.py
